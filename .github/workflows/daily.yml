name: 每日 AI 新闻自动更新

# 每天北京时间 08:30 与 20:30 各采集一次（UTC 00:30 / 12:30）
# 也可在 Actions 页面手动点击 Run workflow 立即刷新
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: ai-daily-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集并写入每日新闻
        run: python3 scripts/daily_update.py

      - name: 提交数据变更
        run: |
          git config user.name  "ai-pulse-bot"
          git config user.email "ai-pulse-bot@users.noreply.github.com"
          git add data/news.js data/news.json
          if git diff --cached --quiet; then
            echo "本次无新增新闻，跳过提交"
          else
            git commit -m "chore: 每日 AI 新闻自动更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 触发 Pages 重新发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" \
            || echo "若本次 push 已自动触发构建，可忽略此提示"

      # 采集脚本在「全部新闻源失败」「数据文件损坏」时会以非零退出码结束，
      # 使本任务变红并在此创建告警 issue（GitHub 会发邮件通知），避免静默断更。
      - name: 采集失败告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::error::每日采集失败，站点数据未更新，请查看上方运行日志。"
          TITLE="⚠️ 每日采集失败 $(date -u +%Y-%m-%d)"
          BODY="本次定时任务失败，站点数据可能未更新。常见原因：全部新闻源不可用、data/news.json 解析失败。运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "$BODY" \
              || echo "告警 issue 创建失败，请手动检查本次运行"
          else
            echo "已存在同名告警 issue，跳过重复创建"
          fi

# 部署说明：在仓库 Settings → Pages 中把 Source 设为 "Deploy from a branch"，
# 分支选 main、目录选 / (root)。本 workflow 每次 push 会触发 Pages 自动重新发布。
